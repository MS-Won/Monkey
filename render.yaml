services:
  - type: web
    name: monkey-backend
    runtime: docker
    # starter: no idle-sleep, avoids cold-start delay (JVM/Okt init) that would
    # hurt closed-test tester engagement over the required 14-day active-use window.
    # NOTE: applying this (Render dashboard / Blueprint sync) starts billing.
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
